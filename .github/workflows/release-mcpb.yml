name: Release MCPB

# Packs the repo into a .mcpb (Anthropic MCP Bundle) and attaches it to a GitHub Release.
#
# Why tag push ≠ automatic run before: GitHub emits `push` for `git push origin v1.2.3`, but
# `release: published` only fires when a *Release* is published in the UI/API — not when a tag
# appears. This workflow listens to both.
#
# Flows:
# - `git push origin v0.1.0` → pack → create Release for that tag (if missing) and attach .mcpb,
#   or upload if the Release already exists.
# - Publish a Release in the UI → `release: published` → attach .mcpb to that tag.
# - Actions → Run workflow → optional tag to upload; artifact always saved.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload .mcpb to this existing release tag (e.g. v0.1.0). Leave empty to only upload a workflow artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and pack
        run: |
          set -euo pipefail
          npx --yes @anthropic-ai/mcpb validate .
          mkdir -p dist
          NAME="$(node -p "require('./manifest.json').name")"
          VER="$(node -p "require('./manifest.json').version")"
          OUT="dist/${NAME}-${VER}.mcpb"
          npx --yes @anthropic-ai/mcpb pack . "$OUT"
          echo "MCPB_PATH=$OUT" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
          retention-days: 90

      - name: Create or update release (version tag pushed)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MCPB_PATH" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$MCPB_PATH"
          fi

      - name: Attach to release (on Release published)
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$MCPB_PATH" --clobber

      - name: Attach to release (manual, tag provided)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "$MCPB_PATH" --clobber
