name: Release MCPB

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload .mcpb to this existing release tag (e.g. v0.1.0). Leave empty to only upload a workflow artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and pack
        run: |
          set -euo pipefail
          npx --yes @anthropic-ai/mcpb validate .
          mkdir -p dist
          NAME="$(node -p "require('./manifest.json').name")"
          VER="$(node -p "require('./manifest.json').version")"
          OUT="dist/${NAME}-${VER}.mcpb"
          npx --yes @anthropic-ai/mcpb pack . "$OUT"
          echo "MCPB_PATH=$OUT" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
          retention-days: 90

      - name: Create or update release (version tag pushed)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MCPB_PATH" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$MCPB_PATH"
          fi

      - name: Attach to release (on Release published)
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$MCPB_PATH" --clobber

      - name: Attach to release (manual, tag provided)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "$MCPB_PATH" --clobber
