name: Package Claude Desktop Skill

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/package-desktop-skill.sh"
      - ".github/workflows/package-desktop-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history not required; fetch tags so ``skills-latest`` can be updated safely.
          fetch-depth: 0

      - name: Build nordstellar.zip
        run: bash scripts/package-desktop-skill.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nordstellar-desktop-skill
          path: dist/nordstellar.zip
          retention-days: 90

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-latest
          name: NordStellar Claude Desktop Skill
          body: |
            ## Install

            1. Download `nordstellar.zip`
            2. Open Claude Desktop → **Settings > Skills > + > Upload a skill**
            3. Select the downloaded ZIP

            Built automatically from the `skills/` directory on every push to `main`.
          files: dist/nordstellar.zip
          make_latest: false

      # ``action-gh-release`` uploads assets but may leave the ``skills-latest`` tag on an old
      # commit. Move the floating tag to the SHA that built this ZIP so the release page matches.
      - name: Point skills-latest tag at this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f skills-latest
          git push origin "refs/tags/skills-latest" --force
