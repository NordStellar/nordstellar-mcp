name: Check dependency licenses

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (locked)
        run: uv sync --frozen

      - name: Install pip-licenses
        run: uv pip install pip-licenses

      # Per-clause check: splits ``;`` and `` OR `` (see scripts/check_license_clauses.py).
      - name: Enforce permissive-compatible dependency licenses
        run: uv run python scripts/check_license_clauses.py
