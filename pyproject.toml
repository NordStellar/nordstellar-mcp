[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nordstellar-mcp"
version = "0.1.2"
description = "Auth proxy that forwards MCP tool calls to a remote NordStellar MCP server"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "keyring>=25.0.0",
]

[project.scripts]
nordstellar-mcp = "nordstellar_remote_mcp_proxy:main"

[tool.hatch.build]
include = ["nordstellar_remote_mcp_proxy.py", "templates"]

[tool.pip-licenses]
ignore-packages = ["nordstellar-mcp"]

[tool.license-clause-check]
# Split each license on ``;`` and `` OR ``; fail when any clause matches (substring match when partial-match is true).
# Naive SPDX: does not interpret AND / WITH / parentheses.
partial-match = true
fail-on = "UNKNOWN;GNU Affero;Affero General Public;GNU General Public;GNU Lesser General;GNU Library General;European Union Public;Eclipse Public License;Common Development and Distribution;Open Software License;Microsoft Reciprocal License;Netscape Public License"
